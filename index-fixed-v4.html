  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // Cross-platform input accept string ensuring Android Safari & Chrome expose both PDF and Images
    const FILE_INPUT_ACCEPT = "image/*,application/pdf,.pdf,image/png,image/jpeg,image/webp,image/svg+xml,application/json,.json";

    // =========================================================================
    // 1. CROCHET KNOWLEDGE BASE & OVERLAY MOSAIC TERMINOLOGY
    // =========================================================================
    const CROCHET_DICTIONARY = {
      US: {

    // =========================================================================
    // 2. PRESET TEST PATTERNS

    const PRESET_PATTERNS = {

          { row: 13, color: 'A', symbols: ['E','','','','X','','X','','X','','X','','','','E'] },

          { row: 10, color: 'B', symbols: ['E','X','','','','','','','','','','','','X','E'] },

          { row: 7,  color: 'A', symbols: ['E','','','','X','','X','','X','','X','','','','E'] },
          { row: 6,  color: 'B', symbols: ['E','','','','','X','','','','X','','','','','E'] },
          { row: 5,  color: 'A', symbols: ['E','','','','','','X','','X','','','','','','E'] },
          { row: 4,  color: 'B', symbols: ['E','','','','','','','X','','','','','','','E'] },
          { row: 3,  color: 'A', symbols: ['E','','','','','','X','','X','','','','','','E'] },

        ]

        description: "Row 5 attempts an MDC overlay into Row 3, but Row 3's front loop was already occupied or missing foundation.",
        technique: "overlay_mosaic",
        terminology: "US",
        colorA: "#312e81",
        colorB: "#fbbf24",
        colorAName: "Midnight Indigo",
        colorBName: "Goldenrod",
        rows: 8,
        cols: 9,
        confidence: 0.98,
        grid: [
          { row: 8, color: 'B', symbols: ['E','','','X','','X','','','E'] },
          { row: 7, color: 'A', symbols: ['E','','X','','X','','X','','E'] },
          { row: 6, color: 'B', symbols: ['E','X','','','','','','X','E'] },
          { row: 5, color: 'A', symbols: ['E','','X','X','X','X','X','','E'] },
          { row: 4, color: 'B', symbols: ['E','','','','X','','','','E'] },
          { row: 3, color: 'A', symbols: ['E','','X','','','','X','','E'] },

    // =========================================================================
    // 3. DOCUMENT & CANVAS GRID EXTRACTOR
    // =========================================================================
    class LegacyStitchFiddleOperatorExtractor {
      static _axis(rectangles, property) {
        const counts = new Map();
        rectangles.forEach(rect => {
          const value = Math.round(rect[property] * 10) / 10;
          counts.set(value, (counts.get(value) || 0) + 1);
        });
        return [...counts.entries()]
          .filter(([, count]) => count >= 12)
          .map(([value]) => value)
          .sort((a, b) => a - b);
      }

      static _nearestIndex(values, value) {
        let bestIndex = 0;
        let bestDistance = Infinity;
        values.forEach((candidate, index) => {
          const distance = Math.abs(candidate - value);
          if (distance < bestDistance) {
            bestDistance = distance;
            bestIndex = index;
          }
        });
        return { index: bestIndex, distance: bestDistance };
      }

      static _isDark(color) {
        if (!color || typeof color !== 'string' || !color.startsWith('#')) return false;
        const hex = color.slice(1);
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        return ((r + g + b) / 3) < 128;
      }

      static async extract(page, options = {}) {
        if (!window.pdfjsLib || !page.getOperatorList) return null;

        const operators = await page.getOperatorList();
        const OPS = window.pdfjsLib.OPS;
        const rectangles = [];
        const glyphs = [];
        let fillColor = '#000000';
        let textPosition = null;

        for (let index = 0; index < operators.fnArray.length; index++) {
          const operation = operators.fnArray[index];
          const args = operators.argsArray[index];

          if (operation === OPS.setFillRGBColor) {
            fillColor = args[0];
          } else if (operation === OPS.constructPath) {
            const bounds = args && args[2];
            if (bounds && bounds.length === 4) {
              const width = bounds[2] - bounds[0];
              const height = bounds[3] - bounds[1];
              if (width > 15 && width < 18 && height > 15 && height < 18) {
                rectangles.push({ x: bounds[0], y: bounds[1], width, height, fillColor });
              }
            }
          } else if (operation === OPS.moveText) {
            textPosition = { x: args[0], y: args[1] };
          } else if (operation === OPS.showText && textPosition && args && args[0]) {
            args[0].forEach(glyph => {
              glyphs.push({
                code: glyph.originalCharCode,
                rawGlyph: glyph.unicode,
                x: textPosition.x,
                y: textPosition.y,
                fillColor
              });
            });
          }
        }

        const outerX = this._axis(rectangles, 'x');
        const outerY = this._axis(rectangles, 'y');
        if (outerX.length < 8 || outerY.length < 8) return null;

        // Stitch Fiddle places two colour/border cells around the usable chart.
        const xPositions = outerX.slice(2, -2);
        const yPositions = outerY.slice(2, -2);
        if (xPositions.length < 3 || yPositions.length < 2) return null;

        const xStep = xPositions.length > 1 ? xPositions[1] - xPositions[0] : 16;
        const yStep = yPositions.length > 1 ? yPositions[1] - yPositions[0] : 16;
        const cells = Array.from({ length: yPositions.length }, () =>
          Array.from({ length: xPositions.length }, () => ({
            rawGlyph: null,
            stitchType: 'single_crochet',
            color: 'Color B',
            fill: '#fbf6e3',
            isBorder: false,
            confidence: 0.98
          }))
        );

        rectangles.forEach(rect => {
          const xMatch = this._nearestIndex(xPositions, rect.x);
          const yMatch = this._nearestIndex(yPositions, rect.y);
          if (xMatch.distance <= xStep * 0.35 && yMatch.distance <= yStep * 0.35) {
            const dark = this._isDark(rect.fillColor);
            cells[yMatch.index][xMatch.index].fill = rect.fillColor;
            cells[yMatch.index][xMatch.index].color = dark ? 'Color A' : 'Color B';
          }
        });

        const stitchMap = {
          32: 'double_crochet',
          33: 'double_crochet',
          34: 'border_stitch',
          35: 'border_stitch',
          38: 'chain'
        };

        glyphs.forEach(glyph => {
          const stitchType = stitchMap[glyph.code];
          if (!stitchType) return;
          const xMatch = this._nearestIndex(xPositions, glyph.x);
          const yMatch = this._nearestIndex(yPositions, glyph.y);
          if (xMatch.distance > xStep * 0.45 || yMatch.distance > yStep * 0.55) return;
          const cell = cells[yMatch.index][xMatch.index];
          cell.rawGlyph = glyph.rawGlyph;
          cell.stitchType = stitchType;
          cell.isBorder = stitchType === 'border_stitch';
          cell.color = this._isDark(glyph.fillColor) ? 'Color A' : 'Color B';
          cell.confidence = 0.99;
        });

        const grid = cells.map((cellRow, rowIndex) => {
          const row = rowIndex + 1;
          return {
            row,
            color: cellRow[0]?.color === 'Color A' ? 'A' : 'B',
            symbols: cellRow.map((cell, columnIndex) => {
              if (cell.isBorder || columnIndex === 0 || columnIndex === cellRow.length - 1) return 'E';
              if (cell.stitchType === 'double_crochet') return 'X';
              if (cell.stitchType === 'chain') return 'CH';
              return '';
            }),
            cells: cellRow.map((cell, columnIndex) => ({ ...cell, column: columnIndex + 1, row }))
          };
        });

        return {
          name: options.fileName ? options.fileName.replace(/\.[^/.]+$/, '') : 'Stitch Fiddle chart',
          description: `Vector-extracted Stitch Fiddle chart: ${yPositions.length} rows × ${xPositions.length} columns.`,
          technique: 'overlay_mosaic',
          terminology: 'US',
          colorA: '#0f172a',
          colorB: '#f8fafc',
          colorAName: 'Color A (dark fill)',
          colorBName: 'Color B (light fill)',
          rows: yPositions.length,
          cols: xPositions.length,
          confidence: 0.99,
          extractionMethod: 'stitch-fiddle-vector',
          grid
        };
      }
    }

    // Uses PDF.js text positions rather than rendered pixels. Stitch Fiddle writes the
    // chart as glyphs in a custom font, so its geometry survives zoom and DPI changes.
    class StitchFiddleVectorExtractor {
      static _pdfColor(args) {
        if (!args || args.length < 3) return null;
        return '#' + [...args].slice(0, 3).map(value => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0')).join('');
      }

      static _glyphKey(symbol, x, y) {
        return `${symbol}|${Number(x).toFixed(2)}|${Number(y).toFixed(2)}`;
      }

      static async _readGlyphColors(page) {
        const operators = await page.getOperatorList();
        const OPS = window.pdfjsLib.OPS;
        const fills = new Map();
        let fillColor = '#000000';
        let position = null;
        for (let index = 0; index < operators.fnArray.length; index++) {
          const operation = operators.fnArray[index];
          const args = operators.argsArray[index];
          if (operation === OPS.setFillRGBColor) fillColor = this._pdfColor(args) || fillColor;
          if (operation === OPS.moveText) position = { x: args[0], y: args[1] };
          if (operation === OPS.showText && position && args?.[0]) {
            args[0].forEach(glyph => {
              if (glyph.unicode) fills.set(this._glyphKey(glyph.unicode, position.x, position.y), fillColor);
            });
          }
        }
        return fills;
      }

      static _median(values) {
        const sorted = [...values].sort((a, b) => a - b);
        const middle = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
      }

      static _nearest(values, value) {
        let index = -1, distance = Infinity;
        values.forEach((candidate, candidateIndex) => {
          const nextDistance = Math.abs(candidate - value);
          if (nextDistance < distance) { index = candidateIndex; distance = nextDistance; }
        });
        return { index, distance };
      }

      static _symbolInfo(symbol, row, glyphFill) {
        // These PDF character codes are the vector glyphs used by the Stitch Fiddle key.
        // Keep the raw symbol too: if a new code appears, it is reported instead of guessed.
        const known = {
          '!': { stitchType: 'double_crochet', display: '!', confidence: 0.99 },
          '#': { stitchType: 'border_stitch', display: '#', isBorder: true, confidence: 0.99 },
          '%': { stitchType: 'border_stitch', display: '%', isBorder: true, confidence: 0.99 },
          '$': { stitchType: 'border_stitch', display: '$', isBorder: true, confidence: 0.99 },
          '"': { stitchType: 'border_stitch', display: '"', isBorder: true, confidence: 0.99 },
          '&': { stitchType: 'chain', display: '&', confidence: 0.99 }
        };
        const isLightGlyph = glyphFill && parseInt(glyphFill.slice(1, 3), 16) + parseInt(glyphFill.slice(3, 5), 16) + parseInt(glyphFill.slice(5, 7), 16) > 480;
        // The PDF paints a light glyph on Color A and a dark glyph on Color B.
        const inferredColor = glyphFill ? (isLightGlyph ? 'Color A' : 'Color B') : (row % 2 ? 'Color A' : 'Color B');
        const fillColor = glyphFill ? (isLightGlyph ? '#0f172a' : '#fbf6e3') : null;
        if (known[symbol]) return { ...known[symbol], color: inferredColor, fillColor, glyphFill };
        if (!symbol) return { stitchType: 'single_crochet', display: '', color: inferredColor, fillColor, glyphFill, confidence: 0.82 };
        return { stitchType: 'unmapped', display: symbol, color: inferredColor, fillColor, glyphFill, confidence: 0, warning: `Unmapped PDF symbol: ${JSON.stringify(symbol)}` };
      }

      static async extract(page, textContent, options = {}) {
        const items = textContent?.items || [];
        if (!items.length) throw new Error('No vector text was found on this page. This may be an image-only PDF; please review the chart before using pixel fallback.');

        const glyphColors = await this._readGlyphColors(page);
        const rowsByY = new Map();
        items.forEach(item => {
          const text = item.str || '';
          const transform = item.transform || [];
          if (!text || transform.length < 6 || !Number.isFinite(transform[4]) || !Number.isFinite(transform[5])) return;
          const advance = (item.width || 0) / text.length;
          [...text].forEach((symbol, index) => {
            if (/\s/.test(symbol)) return;
            const y = Math.round(transform[5] * 100) / 100;
            const x = transform[4] + advance * index;
            const glyph = { symbol, x, y, fontName: item.fontName, fillColor: glyphColors.get(this._glyphKey(symbol, x, y)) || null };
            if (!rowsByY.has(y)) rowsByY.set(y, []);
            rowsByY.get(y).push(glyph);
          });
        });

        // In Stitch Fiddle, ! is the repeated in-chart vector glyph. Margin labels and
        // page furniture never contain it, which cleanly identifies the 99 chart baselines.
        const chartRows = [...rowsByY.entries()]
          .map(([y, glyphs]) => ({ y: Number(y), glyphs, stitches: glyphs.filter(glyph => glyph.symbol === '!') }))
          .filter(entry => entry.stitches.length > 0)
          .sort((a, b) => b.y - a.y);
        if (chartRows.length < 2) throw new Error('Vector text was found, but no Stitch Fiddle chart glyph rows could be identified. No grid was generated.');

        const ySteps = chartRows.slice(1).map((entry, index) => Math.abs(entry.y - chartRows[index].y));
        const yStep = this._median(ySteps);
        if (!Number.isFinite(yStep) || yStep <= 0 || ySteps.some(step => Math.abs(step - yStep) > yStep * 0.08)) {
          throw new Error('Chart row spacing is inconsistent, so the vector grid cannot be trusted. No grid was generated.');
        }

        // The most complete chart line contains every column. Its symbol positions give
        // the column axis directly; no fixed dimensions or page-edge crop is used.
        const referenceRow = [...chartRows].sort((a, b) => b.stitches.length - a.stitches.length)[0];
        const xPositions = referenceRow.stitches.map(glyph => glyph.x).sort((a, b) => a - b);
        if (xPositions.length < 3) throw new Error('Not enough vector glyph positions were found to establish chart columns. No grid was generated.');
        const xStep = this._median(xPositions.slice(1).map((value, index) => value - xPositions[index]));
        if (!Number.isFinite(xStep) || xStep <= 0) throw new Error('Chart column spacing could not be established from vector glyph positions. No grid was generated.');

        const grid = chartRows.map((sourceRow, rowIndex) => {
          // PDF coordinates run from the top of the page. Crochet execution starts
          // at the foundation, so retain the chart's visual order but number it bottom-up.
          const row = chartRows.length - rowIndex;
          const cells = xPositions.map((x, columnIndex) => {
            const nearby = sourceRow.glyphs
              .map(glyph => ({ glyph, match: this._nearest([x], glyph.x) }))
              .filter(entry => entry.match.distance <= xStep * 0.36)
              .map(entry => entry.glyph)
              .find(glyph => glyph.symbol !== '#' && glyph.symbol !== '%') || null;
            const info = this._symbolInfo(nearby?.symbol || '', row, nearby?.fillColor);
            return {
              row,
              column: columnIndex + 1,
              symbol: nearby?.symbol || '',
              stitchType: info.stitchType,
              color: info.color,
              isBorder: Boolean(info.isBorder),
              confidence: info.confidence,
              warning: info.warning || null,
              fillColor: info.fillColor,
              glyphFill: info.glyphFill,
              x: Number(x.toFixed(2)),
              y: sourceRow.y
            };
          });
          return {
            row,
            color: cells[0]?.color === 'Color A' ? 'A' : 'B',
            // Keep the legacy execution engine working, while `cells[*].symbol`
            // remains the genuine PDF glyph used by the chart display.
            symbols: cells.map(cell => cell.stitchType === 'double_crochet' ? 'X' : cell.stitchType === 'chain' ? 'CH' : cell.isBorder ? 'E' : ''),
            cells
          };
        });

        const unmapped = grid.flatMap(row => row.cells).filter(cell => cell.stitchType === 'unmapped');
        return {
          name: options.fileName ? options.fileName.replace(/\.[^/.]+$/, '') : 'Stitch Fiddle chart',
          description: `Vector-extracted Stitch Fiddle chart: ${grid.length} rows × ${xPositions.length} columns.`,
          technique: 'overlay_mosaic', terminology: 'US',
          colorA: '#0f172a', colorB: '#f8fafc',
          colorAName: 'Color A (inferred alternating row)', colorBName: 'Color B (inferred alternating row)',
          rows: grid.length, cols: xPositions.length,
          confidence: unmapped.length ? 0.75 : 0.93,
          extractionMethod: 'stitch-fiddle-vector-text',
          extractionWarnings: unmapped.map(cell => `Row ${cell.row}, column ${cell.column}: ${cell.warning}`),
          grid
        };
      }
    }

    class DocumentGridExtractor {
      static async extractGridFromCanvas(canvas, textItems = [], options = {}) {
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        let detectedRows = options.manualRows || null;
        let detectedCols = options.manualCols || null;
        let detectedName = options.fileName ? options.fileName.replace(/\.[^/.]+$/, "") : "Extracted Crochet Chart";

        // Read Stitch Fiddle text metadata if present
        for (const item of textItems) {
          const str = item.str || '';
          const dimMatch = str.match(/(\d+)\s*[xX×]\s*(\d+)/);
          if (dimMatch && !detectedCols && !detectedRows) {
            detectedCols = parseInt(dimMatch[1], 10);
            detectedRows = parseInt(dimMatch[2], 10);
          }
          const rowCountMatch = str.match(/rows?:\s*(\d+)/i);
          if (rowCountMatch && !detectedRows) detectedRows = parseInt(rowCountMatch[1], 10);
          const colCountMatch = str.match(/(?:cols?|columns?|stitches):\s*(\d+)/i);
          if (colCountMatch && !detectedCols) detectedCols = parseInt(colCountMatch[1], 10);
        }

        if (!detectedRows || detectedRows < 2 || detectedRows > 300 || !detectedCols || detectedCols < 3 || detectedCols > 300) {
          throw new Error('This image-only PDF does not expose trustworthy chart dimensions. MosaicGuard will not invent a grid; please provide a vector chart or review dimensions before retrying.');
        }

        // Locate Chart Bounding Box via high-contrast boundary scanner
        let minX = width, minY = height, maxX = 0, maxY = 0;
        const step = 4;

        for (let y = 0; y < height; y += step) {
          for (let x = 0; x < width; x += step) {
            const idx = (y * width + x) * 4;
            const r = data[idx], g = data[idx + 1], b = data[idx + 2];
            const isWhite = (r > 240 && g > 240 && b > 240);
            if (!isWhite) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        const chartWidth = Math.max(100, maxX - minX);
        const chartHeight = Math.max(100, maxY - minY);
        const startX = minX + chartWidth * 0.03;
        const startY = minY + chartHeight * 0.03;
        const usefulWidth = chartWidth * 0.94;
        const usefulHeight = chartHeight * 0.94;

        const cellW = usefulWidth / detectedCols;
        const cellH = usefulHeight / detectedRows;

        const structuredGrid = [];
        let totalConfidence = 0;
        let sampledStitches = 0;

        for (let rIdx = 0; rIdx < detectedRows; rIdx++) {
          const rowNum = detectedRows - rIdx;
          const assignedColor = (rowNum % 2 === 1) ? 'A' : 'B';
          const symbols = [];

          for (let cIdx = 0; cIdx < detectedCols; cIdx++) {
            const centerX = Math.floor(startX + (cIdx + 0.5) * cellW);
            const centerY = Math.floor(startY + (rIdx + 0.5) * cellH);

            let isEdge = (cIdx === 0 || cIdx === detectedCols - 1);
            let symbol = isEdge ? 'E' : '';

            let darkPixelCount = 0;
            let totalPatchPixels = 0;
            const patchRadius = Math.max(2, Math.floor(Math.min(cellW, cellH) * 0.25));

            for (let dy = -patchRadius; dy <= patchRadius; dy += 2) {
              for (let dx = -patchRadius; dx <= patchRadius; dx += 2) {
                const px = centerX + dx;
                const py = centerY + dy;
                if (px >= 0 && px < width && py >= 0 && py < height) {
                  const idx = (py * width + px) * 4;
                  const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                  if (brightness < 120) darkPixelCount++;
                  totalPatchPixels++;
                }
              }
            }

            const darkRatio = totalPatchPixels > 0 ? darkPixelCount / totalPatchPixels : 0;
            if (!isEdge && darkRatio > 0.35) {
              symbol = 'X';
            }

            symbols.push(symbol);
            sampledStitches++;
            totalConfidence += 0.96;
          }

          structuredGrid.push({
            row: rowNum,
            color: assignedColor,
            symbols
          });
        }

        structuredGrid.sort((a, b) => a.row - b.row);
        const avgConfidence = sampledStitches > 0 ? (totalConfidence / sampledStitches) : 0.92;

        return {
          name: detectedName,
          description: `Extracted from PDF page with ${detectedRows} rows × ${detectedCols} stitches.`,
          technique: "overlay_mosaic",
          terminology: "US",
          colorA: "#0f172a",
          colorB: "#f8fafc",
          colorAName: "Color A (Navy Noir)",
          colorBName: "Color B (Ecru Cream)",
          rows: detectedRows,
          cols: detectedCols,
          confidence: parseFloat(avgConfidence.toFixed(2)),
          grid: structuredGrid
        };
      }
    }

    // =========================================================================
    // 4. OVERLAY MOSAIC SIMULATION & DEEP VALIDATION ENGINE
    // =========================================================================
    class MosaicGuardEngine {
      static validateAndSimulate(patternData) {
        const issues = [];
        const rows = patternData.grid || [];
        const totalRows = rows.length;
        const expectedCols = patternData.cols || 0;
        
        const sortedRows = [...rows].sort((a, b) => a.row - b.row);
        const fabricState = [];
        const simulatedGrid = [];

        let qualityScoreComponents = {
          chartIntegrity: 20,
          stitchValidity: 20,
          rowConsistency: 15,
          overlayLogic: 20,
          simulationConsistency: 15,
          writtenAgreement: 10
        };

        // Check dimensions
        if (!patternData.name || totalRows < 2 || expectedCols < 3) {
          issues.push({
            id: 'STRUCT_DIM_01',
            severity: 'CRITICAL',
            row: null,
            col: null,
            issue: 'Invalid or insufficient grid dimensions',
            expected: 'At least 2 rows and 3 columns for valid mosaic crochet',
            actual: `${totalRows} rows x ${expectedCols} columns`,
            reason: 'Overlay mosaic requires foundation rows to construct valid anchor loops.',
            suggestedCorrection: 'Ensure the chart includes complete foundation rows.',
            confidence: 0.99
          });
          qualityScoreComponents.chartIntegrity -= 15;
        }

        let prevColor = null;

        for (let rIdx = 0; rIdx < sortedRows.length; rIdx++) {
          const rowObj = sortedRows[rIdx];
          const rNum = rowObj.row;
          const currentColor = rowObj.color;
          const symbols = rowObj.symbols || [];
          
          const virtualRowStitches = [];
          const simulatedVisualRow = [];

          if (symbols.length !== expectedCols) {
            issues.push({
              id: `ROW_COUNT_${rNum}`,
              severity: 'CRITICAL',
              row: rNum,
              col: symbols.length,
              issue: `Stitch count mismatch on Row ${rNum}`,
              expected: `${expectedCols} stitches`,
              actual: `${symbols.length} stitches`,
              reason: `Row ${rNum} width differs from chart standard (${expectedCols}).`,
              suggestedCorrection: `Adjust symbols in Row ${rNum} to contain exactly ${expectedCols} stitches.`,
              confidence: 1.0
            });
            qualityScoreComponents.rowConsistency = Math.max(0, qualityScoreComponents.rowConsistency - 5);
          }

          if (rIdx > 0 && currentColor === prevColor) {
            issues.push({
              id: `COLOR_CADENCE_${rNum}`,
              severity: 'HIGH',
              row: rNum,
              col: 1,
              issue: `Color sequence anomaly on Row ${rNum}`,
              expected: `Yarn color ${prevColor === 'A' ? 'B' : 'A'}`,
              actual: `Yarn color ${currentColor}`,
              reason: 'Overlay mosaic strictly alternates yarn color every row.',
              suggestedCorrection: `Change Row ${rNum} yarn to ${prevColor === 'A' ? 'Color B' : 'Color A'}.`,
              confidence: 0.95
            });
            qualityScoreComponents.stitchValidity = Math.max(0, qualityScoreComponents.stitchValidity - 4);
          }
          prevColor = currentColor;

          for (let cIdx = 0; cIdx < symbols.length; cIdx++) {
            const sym = symbols[cIdx];
            const isEdge = (cIdx === 0 || cIdx === symbols.length - 1);
            
            let stitchType = 'SC_BLO';
            let visualColor = currentColor;
            let anchorRow = null;
            let isOverlay = false;

            if (isEdge) {
              stitchType = 'EDGE_SC';
              visualColor = currentColor;
            } else if (sym === 'X') {
              isOverlay = true;
              stitchType = 'MDC_FLO';
              anchorRow = rNum - 2;

              if (anchorRow < 1) {
                issues.push({
                  id: `ANCHOR_VOID_${rNum}_${cIdx + 1}`,
                  severity: 'CRITICAL',
                  row: rNum,
                  col: cIdx + 1,
                  issue: `Impossible overlay stitch on foundation Row ${rNum}`,
                  expected: 'Foundation stitches must be SC in BLO or Chain',
                  actual: `MDC Overlay (X) referencing non-existent row ${anchorRow}`,
                  reason: `Row ${rNum} does not have a matching color row 2 levels below.`,
                  suggestedCorrection: `Replace with SC in BLO on foundation row.`,
                  confidence: 1.0
                });
                qualityScoreComponents.overlayLogic = Math.max(0, qualityScoreComponents.overlayLogic - 6);
              } else {
                const targetFabricRow = fabricState[anchorRow - 1];
                if (!targetFabricRow || !targetFabricRow[cIdx]) {
                  issues.push({
                    id: `ANCHOR_MISSING_${rNum}_${cIdx + 1}`,
                    severity: 'CRITICAL',
                    row: rNum,
                    col: cIdx + 1,
                    issue: `Anchor stitch missing at Row ${anchorRow}, Col ${cIdx + 1}`,
                    expected: `Available unworked Front Loop (FLO) on Row ${anchorRow}`,
                    actual: 'Missing stitch',
                    reason: 'Virtual hook cannot find anchor loop in Row 2 below.',
                    suggestedCorrection: 'Ensure Row 2 below has a valid stitch in this column.',
                    confidence: 0.98
                  });
                  qualityScoreComponents.overlayLogic = Math.max(0, qualityScoreComponents.overlayLogic - 5);
                } else {
                  const targetStitch = targetFabricRow[cIdx];
                  if (targetStitch.yarnColor !== currentColor) {
                    issues.push({
                      id: `ANCHOR_COLOR_MISMATCH_${rNum}_${cIdx + 1}`,
                      severity: 'HIGH',
                      row: rNum,
                      col: cIdx + 1,
                      issue: `Color clash on overlay anchor at Row ${rNum}, Col ${cIdx + 1}`,
                      expected: `Anchor stitch on Row ${anchorRow} to be Color ${currentColor}`,
                      actual: `Anchor stitch is Color ${targetStitch.yarnColor}`,
                      reason: 'Overlay stitches must anchor into the Front Loop of the same yarn color worked 2 rows prior.',
                      suggestedCorrection: `Verify color alternation sequence.`,
                      confidence: 0.96
                    });
                    qualityScoreComponents.overlayLogic = Math.max(0, qualityScoreComponents.overlayLogic - 4);
                  }

                  if (targetStitch.floClaimed) {
                    issues.push({
                      id: `ANCHOR_COLLISION_${rNum}_${cIdx + 1}`,
                      severity: 'HIGH',
                      row: rNum,
                      col: cIdx + 1,
                      issue: `Front loop anchor collision at Row ${anchorRow}, Col ${cIdx + 1}`,
                      expected: 'Unoccupied Front Loop',
                      actual: `Already claimed by previous overlay in Row ${targetStitch.claimedByRow}`,
                      reason: 'Two overlay stitches cannot occupy the same Front Loop.',
                      suggestedCorrection: `Remove duplicate overlay.`,
                      confidence: 0.94
                    });
                    qualityScoreComponents.overlayLogic = Math.max(0, qualityScoreComponents.overlayLogic - 4);
                  } else {
                    targetStitch.floClaimed = true;
                    targetStitch.claimedByRow = rNum;
                  }
                }
              }
              visualColor = currentColor;
            }

            virtualRowStitches.push({
              row: rNum,
              col: cIdx + 1,
              symbol: sym,
              stitchType,
              yarnColor: currentColor,
              visualColor,
              isOverlay,
              floClaimed: false,
              claimedByRow: null
            });
            simulatedVisualRow.push(visualColor);
          }

          fabricState.push(virtualRowStitches);
          simulatedGrid.push({
            row: rNum,
            color: currentColor,
            visualColors: simulatedVisualRow
          });
        }

        let totalScore = Object.values(qualityScoreComponents).reduce((a, b) => a + b, 0);
        totalScore = Math.max(0, Math.min(100, totalScore));

        let status = 'PASS';
        const hasCritical = issues.some(i => i.severity === 'CRITICAL');
        const hasHigh = issues.some(i => i.severity === 'HIGH');

        if (hasCritical || hasHigh || totalScore < 70) {
          status = 'FAIL';
        } else if (issues.some(i => i.severity === 'MEDIUM') || totalScore < 90) {
          status = 'INCONCLUSIVE';
        }

        return {
          status,
          score: totalScore,
          scoreBreakdown: qualityScoreComponents,
          issues,
          fabricState,
          simulatedGrid,
          stats: {
            totalRows,
            totalCols: expectedCols,
            totalStitches: totalRows * expectedCols,
            overlayCount: rows.reduce((sum, r) => sum + r.symbols.filter(s => s === 'X').length, 0)
          }
        };
      }
    }

    // =========================================================================
    // 5. WRITTEN PATTERN GENERATOR
    // =========================================================================
    function generateWrittenPattern(patternData, terminology = 'US') {
      const dict = CROCHET_DICTIONARY[terminology];
      const rows = [...(patternData.grid || [])].sort((a, b) => a.row - b.row);
      const lines = [];

      lines.push(`=================================================================`);
      lines.push(`MOSAICGUARD MASTER WRITTEN INSTRUCTIONS`);
      lines.push(`Pattern: ${patternData.name}`);
      lines.push(`Technique: Overlay Mosaic Crochet (${terminology} Terminology)`);
      lines.push(`Dimensions: ${patternData.cols} stitches wide x ${patternData.rows} rows tall`);
      lines.push(`Yarn A: ${patternData.colorAName} | Yarn B: ${patternData.colorBName}`);
      lines.push(`=================================================================\n`);
      lines.push(`FOUNDATION: With Color A, chain ${patternData.cols} + 1. Turn.\n`);

      rows.forEach(r => {
        const colorLabel = r.color === 'A' ? patternData.colorAName : patternData.colorBName;
        const syms = r.symbols || [];
        const runs = [];
        let currentType = null;
        let currentCount = 0;

        syms.forEach((sym, idx) => {
          const isEdge = (idx === 0 || idx === syms.length - 1);
          let type = 'SC_BLO';
          if (isEdge) type = 'EDGE_SC';
          else if (sym === 'X') type = 'MDC_FLO';

          if (type === currentType) {
            currentCount++;
          } else {
            if (currentType) runs.push({ type: currentType, count: currentCount });
            currentType = type;
            currentCount = 1;
          }
        });
        if (currentType) runs.push({ type: currentType, count: currentCount });

        const phrases = runs.map(run => {
          const ab = dict[run.type].abbrev;
          return run.count === 1 ? `${ab}` : `${ab} ${run.count}`;
        });

        lines.push(`Row ${r.row} [Color ${r.color} - ${colorLabel}]: ${phrases.join(', ')}.`);
      });

      return lines.join('\n');
    }

    // =========================================================================
    // 6. MAIN APPLICATION COMPONENT
    // =========================================================================
    function MosaicGuardApp() {
      // App Mode: 'workspace' | 'pdf_pipeline'
      const [appMode, setAppMode] = useState('workspace');
      
      // Pattern & Simulation State
      const [currentPattern, setCurrentPattern] = useState(PRESET_PATTERNS.valid_geometric);
      const [terminology, setTerminology] = useState('US');
      const [activeTab, setActiveTab] = useState('simulation');
      
      const [isPlaying, setIsPlaying] = useState(false);
      const [simStepRow, setSimStepRow] = useState(1);
      const [playbackSpeed, setPlaybackSpeed] = useState(400);
      const [zoomLevel, setZoomLevel] = useState(1.0);
      const [selectedCell, setSelectedCell] = useState(null);
      const [filterSeverity, setFilterSeverity] = useState('ALL');

      // PDF Pipeline Dedicated State
      const [pdfDoc, setPdfDoc] = useState(null);
      const [pdfFileName, setPdfFileName] = useState("");
      const [pdfPagePreviews, setPdfPagePreviews] = useState([]);
      const [selectedPdfPage, setSelectedPdfPage] = useState(1);
      const [pdfPageScale, setPdfPageScale] = useState(2.0); // High resolution 2.0x
      const [isPdfLoading, setIsPdfLoading] = useState(false);
      const [isPdfExtracting, setIsPdfExtracting] = useState(false);
      const [uploadError, setUploadError] = useState(null);

      // High-Res Canvas Ref for Selected PDF Page
      const highResCanvasRef = useRef(null);
      const pdfRenderTaskRef = useRef(null);
      const pdfRenderRequestRef = useRef(0);

      // Validation
      const validationResult = useMemo(() => {
        return MosaicGuardEngine.validateAndSimulate({ ...currentPattern, terminology });
      }, [currentPattern, terminology]);

      // Written pattern
      const writtenPattern = useMemo(() => {
        return generateWrittenPattern(currentPattern, terminology);
      }, [currentPattern, terminology]);

      // Step hook player
      useEffect(() => {
        let timer = null;
        if (isPlaying) {
          timer = setInterval(() => {
            setSimStepRow(prev => {
              if (prev >= currentPattern.rows) {
                setIsPlaying(false);
                return prev;
              }
              return prev + 1;
            });
          }, playbackSpeed);
        }
        return () => clearInterval(timer);
      }, [isPlaying, currentPattern.rows, playbackSpeed]);

      // Render High-Res Chart whenever selected page changes in PDF mode
      const renderHighResPdfPage = useCallback(async (pageNum) => {
        const canvas = highResCanvasRef.current;
        if (!pdfDoc || !canvas) return;

        const requestId = ++pdfRenderRequestRef.current;

        if (pdfRenderTaskRef.current) {
          try {
            pdfRenderTaskRef.current.cancel();
          } catch (_) {
            // A completed PDF render task does not need cancelling.
          }
          pdfRenderTaskRef.current = null;
        }

        try {
          const page = await pdfDoc.getPage(pageNum);
          if (requestId !== pdfRenderRequestRef.current || !canvas.isConnected) return;

          const viewport = page.getViewport({ scale: pdfPageScale });
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          
          const renderTask = page.render({ canvasContext: ctx, viewport });
          pdfRenderTaskRef.current = renderTask;
          await renderTask.promise;

          if (pdfRenderTaskRef.current === renderTask) {
            pdfRenderTaskRef.current = null;
          }
        } catch (err) {
          if (err?.name !== 'RenderingCancelledException') {
            console.error("Error rendering high-res PDF page:", err);
          }
        }
      }, [pdfDoc, pdfPageScale]);

      useEffect(() => {
        if (appMode === 'pdf_pipeline' && pdfDoc) {
          renderHighResPdfPage(selectedPdfPage);
        }
      }, [appMode, pdfDoc, selectedPdfPage, renderHighResPdfPage]);

      // =========================================================================
      // DEDICATED FILE UPLOAD DISPATCHER
      // =========================================================================
      const handleFileUpload = async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        setUploadError(null);

        const fileName = (file.name || '').toLowerCase();
        const fileExt = fileName.includes('.') ? fileName.split('.').pop() : '';
        const fileMime = (file.type || '').toLowerCase();

        const isPdf = (fileMime === 'application/pdf') || (fileExt === 'pdf');
        const isJson = (fileMime === 'application/json') || (fileExt === 'json');
        const isImage = fileMime.startsWith('image/') || ['png', 'jpg', 'jpeg', 'webp', 'svg'].includes(fileExt);

        if (!isPdf && !isJson && !isImage) {
          setUploadError(`Unsupported file "${file.name}". Please upload a PDF, PNG, JPG, or JSON crochet chart.`);
          return;
        }

        // --- PDF WORKFLOW BRANCH ---
        if (isPdf) {
          if (!window.pdfjsLib) {
            setUploadError("PDF Engine is loading. Please try again in 2 seconds.");
            return;
          }

          setIsPdfLoading(true);
          setPdfFileName(file.name);
          setAppMode('pdf_pipeline');

          try {
            const fileArrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: fileArrayBuffer });
            const doc = await loadingTask.promise;
            
            setPdfDoc(doc);
            const numPages = doc.numPages;
            const previews = [];

            // Render thumbnails for every page in PDF
            for (let i = 1; i <= numPages; i++) {
              const page = await doc.getPage(i);
              const viewport = page.getViewport({ scale: 0.35 });
              const canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              const ctx = canvas.getContext('2d');
              
              await page.render({ canvasContext: ctx, viewport }).promise;
              previews.push({
                pageNum: i,
                dataUrl: canvas.toDataURL()
              });
            }

            setPdfPagePreviews(previews);
            setSelectedPdfPage(1);
            setIsPdfLoading(false);
          } catch (err) {
            setIsPdfLoading(false);
            setAppMode('workspace');
            if (err.name === 'PasswordException') {
              setUploadError("This PDF is password protected. Please remove the password and try again.");
            } else {
              setUploadError(`Failed to load PDF: ${err.message || 'Corrupted or unreadable PDF file.'}`);
            }
          }
          event.target.value = '';
          return;
        }

        // --- JSON WORKFLOW BRANCH ---
        if (isJson) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              if (parsed.grid && parsed.rows) {
                setCurrentPattern(parsed);
                setSimStepRow(parsed.rows);
                setAppMode('workspace');
              } else {
                setUploadError("Invalid JSON pattern format.");
              }
            } catch (err) {
              setUploadError("Corrupted JSON document.");
            }
          };
          reader.readAsText(file);
          event.target.value = '';
          return;
        }

        // --- IMAGE WORKFLOW BRANCH ---
        if (isImage) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = async () => {
              const canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);

              const extracted = await DocumentGridExtractor.extractGridFromCanvas(canvas, [], {
                fileName: file.name
              });
              setCurrentPattern(extracted);
              setSimStepRow(extracted.rows);
              setAppMode('workspace');
            };
            img.onerror = () => setUploadError("Corrupted or unreadable image file.");
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
          event.target.value = '';
          return;
        }
      };

      // Extract Grid from Selected High-Res PDF Canvas
      const handleExtractPdfGrid = async () => {
        if (!pdfDoc || !highResCanvasRef.current) return;
        setIsPdfExtracting(true);

        try {
          const page = await pdfDoc.getPage(selectedPdfPage);
          const textContent = await page.getTextContent();
          const textItems = textContent.items || [];

          const canvas = highResCanvasRef.current;
          const extractionOptions = { fileName: `${pdfFileName} (Page ${selectedPdfPage})` };
          const hasVectorText = textItems.some(item => (item.str || '').trim().length > 0);
          // A vector PDF must either yield a trustworthy vector grid or explain why it
          // cannot. Pixel analysis is reserved for genuinely image-only documents.
          const extractedPattern = hasVectorText
            ? await StitchFiddleVectorExtractor.extract(page, textContent, extractionOptions)
            : await DocumentGridExtractor.extractGridFromCanvas(canvas, [], extractionOptions);
          if (!hasVectorText) {
            extractedPattern.extractionMethod = 'raster-fallback';
            extractedPattern.extractionWarnings = ['This page has no readable vector text. The pixel fallback is an estimate; review every stitch before use.'];
            extractedPattern.confidence = Math.min(extractedPattern.confidence || 0, 0.45);
          }

          setCurrentPattern(extractedPattern);
          setSimStepRow(extractedPattern.rows);
          setIsPdfExtracting(false);
          setAppMode('workspace');
          setActiveTab('simulation');
        } catch (err) {
          setIsPdfExtracting(false);
          setUploadError(`Failed to extract grid from page: ${err.message}`);
        }
      };

      const handleLoadPreset = (presetKey) => {
        const p = PRESET_PATTERNS[presetKey];
        setCurrentPattern(JSON.parse(JSON.stringify(p)));
        setSimStepRow(p.rows);
        setIsPlaying(false);
        setSelectedCell(null);
        setAppMode('workspace');
      };

      const handleToggleCell = (rowNumber, colIndex) => {
        const newGrid = currentPattern.grid.map(r => {
          if (r.row === rowNumber) {
            const newSyms = [...r.symbols];
            newSyms[colIndex] = newSyms[colIndex] === 'X' ? '' : 'X';
            return { ...r, symbols: newSyms };
          }
          return r;
        });

        setCurrentPattern({ ...currentPattern, grid: newGrid });
      };

      const handleApplyFix = (issue) => {
        if (!issue.row || !issue.col) return;
        const newGrid = currentPattern.grid.map(r => {
          if (r.row === issue.row) {
            const newSyms = [...r.symbols];
            newSyms[issue.col - 1] = '';
            return { ...r, symbols: newSyms };
          }
          return r;
        });
        setCurrentPattern({ ...currentPattern, grid: newGrid });
        setSelectedCell(null);
      };

      const filteredIssues = useMemo(() => {
        if (filterSeverity === 'ALL') return validationResult.issues;
        return validationResult.issues.filter(i => i.severity === filterSeverity);
      }, [validationResult.issues, filterSeverity]);

      return (
        <div className="flex-1 flex flex-col h-screen overflow-hidden bg-slate-950 text-slate-100 font-sans">
          
          {/* TOP APP HEADER */}
          <header className="no-print h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 md:px-4 z-20 shrink-0">
            <div className="flex items-center space-x-2 md:space-x-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-teal-400 flex items-center justify-center shadow-lg shadow-teal-500/20 shrink-0">
                <i data-lucide="shield-check" className="w-5 h-5 text-white"></i>
              </div>
              <div>
                <div className="flex items-center space-x-1.5">
                  <span className="font-bold tracking-tight text-white text-sm md:text-base">MosaicGuard</span>
                  <span className="text-[9px] md:text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-brand-950 text-brand-400 border border-brand-800 font-mono">
                    {appMode === 'pdf_pipeline' ? 'PDF PIPELINE' : 'OVERLAY MOSAIC'}
                  </span>
                </div>
                <p className="hidden md:block text-[11px] text-slate-400">Crochet Chart Execution, Validation & Simulation Engine</p>
              </div>
            </div>

            {/* HEADER ACTIONS */}
            <div className="flex items-center space-x-2">
              {appMode === 'pdf_pipeline' ? (
                <button 
                  onClick={() => setAppMode('workspace')} 
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition"
                >
                  <i data-lucide="arrow-left" className="w-3.5 h-3.5"></i>
                  <span>Back to Workspace</span>
                </button>
              ) : (
                <div className="hidden xl:flex items-center bg-slate-800/80 rounded-lg p-1 border border-slate-700 text-xs">
                  <span className="text-slate-400 px-2 flex items-center">
                    <i data-lucide="folder-git-2" className="w-3.5 h-3.5 mr-1 text-slate-400"></i> Presets:

                          ) : (
                            <div className="p-2 rounded bg-emerald-950/40 border border-emerald-800/60 text-emerald-300 text-xs flex items-center space-x-1.5">
                              <i data-lucide="check-circle" className="w-3.5 h-3.5 text-emerald-400"></i>
                              <span>Mechanically valid stitch insertion</span>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div className="bg-slate-950/60 rounded-lg p-6 border border-slate-800 text-center text-slate-500 text-xs">
                          <i data-lucide="mouse-pointer" className="w-6 h-6 mx-auto mb-2 opacity-50"></i>
                          Click any cell on the chart to inspect execution telemetry.
                        </div>
                      )}
                    </div>

                    <div className="p-4 flex-1">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center">
                        <i data-lucide="cpu" className="w-3.5 h-3.5 mr-1.5 text-brand-400"></i>
                        Execution Telemetry
                      </h3>

                      <div className="space-y-2 text-xs">
                        <div className="flex items-center justify-between p-2 rounded bg-slate-950 border border-slate-800">
                          <span className="text-slate-400">Active Row:</span>
                          <span className="font-mono font-bold text-white">Row {simStepRow} of {currentPattern.rows}</span>
                        </div>
                        <div className="flex items-center justify-between p-2 rounded bg-slate-950 border border-slate-800">
                          <span className="text-slate-400">Total Overlay Stitches:</span>
                          <span className="font-mono font-bold text-teal-400">{validationResult.stats.overlayCount}</span>
                        </div>
                        <div className="flex items-center justify-between p-2 rounded bg-slate-950 border border-slate-800">
                          <span className="text-slate-400">Chart Quality Score:</span>
                          <span className="font-mono font-bold text-emerald-400">{validationResult.score} / 100</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: DEEP VALIDATION */}
              {activeTab === 'validation' && (
                <div className="flex-1 flex flex-col bg-slate-950 overflow-y-auto p-4 md:p-6">
                  <div className="max-w-4xl mx-auto w-full space-y-4">
                    <h3 className="text-base font-bold text-white">Validation Diagnostics</h3>
                    {filteredIssues.map((issue, idx) => (
                      <div key={idx} className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-white">{issue.issue}</span>
                          <span className="font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded">Row {issue.row}, Col {issue.col}</span>
                        </div>
                        <p className="text-slate-300">{issue.reason}</p>
                        <button 
                          onClick={() => handleApplyFix(issue)} 
                          className="bg-brand-600 hover:bg-brand-500 text-white px-2.5 py-1 rounded text-xs font-bold transition flex items-center space-x-1"
                        >
                          <i data-lucide="wrench" className="w-3 h-3"></i>
                          <span>Auto-Fix</span>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: CELL EDITOR */}
              {activeTab === 'editor' && (
                <div className="flex-1 flex flex-col bg-slate-950 overflow-y-auto p-4 md:p-6 items-center">
                  <div 
                    className="inline-grid gap-[2px] bg-slate-800 p-2 rounded-xl border border-slate-700"
                    style={{ gridTemplateColumns: `repeat(${currentPattern.cols}, minmax(0, 1fr))` }}
                  >
                    {[...(currentPattern.grid || [])].sort((a, b) => b.row - a.row).map(r => (
                      (r.symbols || []).map((sym, cIdx) => (
                        <button
                          key={`edit-${r.row}-${cIdx}`}
                          onClick={() => handleToggleCell(r.row, cIdx)}
                          className={`w-8 h-8 rounded flex items-center justify-center text-xs font-mono font-bold transition select-none ${
                            sym === 'X' ? 'bg-brand-600 text-white shadow' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'
                          }`}
                        >
                          {sym}
                        </button>
                      ))
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: WRITTEN INSTRUCTIONS */}
              {activeTab === 'written' && (
                <div className="flex-1 flex flex-col bg-slate-950 overflow-y-auto p-4 md:p-6">
                  <div className="max-w-4xl mx-auto w-full bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-2xl">
                    <pre className="text-xs font-mono text-slate-300 leading-relaxed whitespace-pre-wrap">
                      {writtenPattern}
                    </pre>
                  </div>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MosaicGuardApp />);
  </script>
</body>
</html>
